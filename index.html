  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Formulario oculto de referencia para que Netlify detecte el formulario
         de Contacto en el build (la app React se renderiza en cliente). El
         atributo `netlify` habilita la detección automática; los envíos llegan
         al panel de Netlify Forms sin código de servidor. -->
    <form name="contact" method="post" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" style="display:none" />
    </form>
  </body>
